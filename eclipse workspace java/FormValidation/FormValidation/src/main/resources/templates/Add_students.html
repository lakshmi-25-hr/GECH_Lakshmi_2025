<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
    <h1>Add Student</h1>
    
    <form action="#" method="post" th:object="${studentDTO}" novalidate>
         
           <label for="name">Name:</label>
           <input type="text" th:field="*{name}" name="name" id="name" placeholder="Enter your name" ><br>
		   <p th:if="${#fields.hasErrors('name')}"th:errors="*{name}"></p>
           <label for="age">Age:</label>
           <input type="number" th:field="*{age}" name="age" id="age" placeholder="Enter your age"><br>
		   <p th:if="${#fields.hasErrors('age')}"th:errors="*{age}"></p>
           <label for="email">Email:</label>
           <input type="text" th:field="*{email}" name="email" id="email" placeholder="Enter ur Email" value="abc@gmail.com" ><br>
		   <p th:if="${#fields.hasErrors('email')}"th:errors="*{email}"></p>
           <label for="password">Password:</label>
           <input type="password" th:field="*{password}"  id="password" placeholder="Enter your Password" ><br>
		   <p th:if="${#fields.hasErrors('password')}"th:errors="*{password}"></p>
           <!-- <button type="submit">Submit</button> -->
           <input type="submit" value="submit">
        </form>
</body>
</html>
