<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    ul{
        list-style-type: circle;
        list-style-position: inside;
    }
    </style>
</head>
<body>
    <h1>Unorderd List</h1>
    <ul>
        <li>first</li>
        <li>second</li>
        <li>third</li>
        <li>four</li>
        <li>five</li>
        <li>six</li>
    </ul>

    <ol>
        <li>fir</li>
        <li>sec</li>
        <li>thir</li>
        <li>fou</li>
        <li>five</li>
    </ol>
    <ol type="a">
        <li>fir</li>
        <li>sec</li>
        <li>thir</li>
        <li>fou</li>
        <li>five</li>
    </ol>
</body>
</html>
