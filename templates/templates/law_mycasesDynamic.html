lawyer-my-cases.html

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Lawyer My Cases</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .status-box {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
        }

        .status-inprogress {
            background-color: orange;
        }

        .status-completed {
            background-color: green;
        }

        .status-upcoming {
            background-color: blue;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="#">Lawyer Dashboard</a>
    </nav>

    <div class="container my-4">
        <h2>My Cases</h2>
        <div id="cases-list" class="row"></div>
    </div>

    <script>
        const cases = [
            {
                caseTitle: "Case #101 - Property Dispute",
                clientName: "John Doe",
                status: "In Progress"
            },
            {
                caseTitle: "Case #102 - Divorce Settlement",
                clientName: "Jane Smith",
                status: "Completed"
            },
            {
                caseTitle: "Case #103 - Contract Violation",
                clientName: "Mike Brown",
                status: "Upcoming Hearing"
            }
        ];

        const casesList = document.getElementById("cases-list");

        cases.forEach(c => {
            const card = document.createElement("div");
            card.className = "col-12 mb-3";

            card.innerHTML = `
      <div class="card p-3">
        <h5>${c.caseTitle}</h5>
        <p>Client: <strong>${c.clientName}</strong></p>
        <div class="text-end">
          <span class="status-box ${c.status === "In Progress" ? "status-inprogress" :
                    c.status === "Completed" ? "status-completed" :
                        "status-upcoming"
                }">${c.status}</span>
        </div>
      </div>
    `;

            casesList.appendChild(card);
        });
    </script>

</body>

</html>
